name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Reports on production dependencies only — a dev-tool advisory doesn't
      # ship to users. Kept non-blocking on purpose: npm's audit endpoint is
      # being retired and answers with 400s and timeouts, and a build that goes
      # red on a registry hiccup just teaches you to ignore CI. Dependabot is
      # what actually watches for advisories here.
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
