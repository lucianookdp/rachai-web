<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Rachaí</title>
    <script>
      // GitHub Pages has no server-side routing, so a direct load or refresh
      // on a client-side route 404s. This is the standard workaround
      // (https://github.com/rafgraph/spa-github-pages): redirect here with
      // the real path encoded in the query string, then index.html restores
      // it with history.replaceState before React mounts.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
